name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y lua5.4
      - run: lua5.4 tests/test_panel.lua

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r tcl-control/backend/requirements.txt
      - run: python -m unittest discover -s tcl-control/backend -v
      - run: python -m unittest discover -s tests -v
      - run: sh -n tcl-control/setup.sh
